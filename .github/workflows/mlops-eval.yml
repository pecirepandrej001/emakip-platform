name: MLOps Evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: "pip"}
      - run: pip install -e .
      - run: python scripts/evaluate_rag.py
