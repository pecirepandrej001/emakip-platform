services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emakip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emakip}
      POSTGRES_DB: ${POSTGRES_DB:-emakip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emakip}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["5432:5432"]

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    volumes:
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    env_file: ../.env
    volumes:
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    env_file: ../.env
    depends_on: [api]
    ports: ["8501:8501"]
    restart: unless-stopped

  mlflow:
    build:
      context: ..
      dockerfile: docker/mlops.Dockerfile
    volumes:
      - mlflow_data:/mlflow
    ports: ["5000:5000"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads:
  hf_cache:
  mlflow_data:
