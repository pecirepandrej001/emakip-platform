apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emakip
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  rules:
    - host: emakip.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: emakip-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: emakip-ui, port: {number: 8501}}}
