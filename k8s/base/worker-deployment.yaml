apiVersion: apps/v1
kind: Deployment
metadata: {name: emakip-worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: emakip-worker}}
  template:
    metadata: {labels: {app: emakip-worker}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/emakip-worker:latest
          envFrom: [{secretRef: {name: emakip-secrets}}]
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "4Gi"}
